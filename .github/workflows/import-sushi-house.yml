name: Import SUSHI HOUSE archive

on:
  push:
    branches:
      - main
    paths:
      - "sushi-house-*.zip"
      - ".github/workflows/import-sushi-house.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sushi-house-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$(find . -maxdepth 1 -type f -name 'sushi-house-*.zip' -printf '%f\n' | sort | tail -n 1)"

          if [ -z "$ARCHIVE" ]; then
            echo "::error::No sushi-house-*.zip found in repository root."
            exit 1
          fi

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE FOUND: $ARCHIVE"
          ls -lh "$ARCHIVE"
          sha256sum "$ARCHIVE"

      - name: Extract archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          set -euo pipefail

          rm -rf .import-tmp
          mkdir -p .import-tmp

          unzip -q "$ARCHIVE" -d .import-tmp

          echo "Archive contents:"
          find .import-tmp -maxdepth 3 -type f | sort

      - name: Detect project root
        id: root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=".import-tmp"

          # If the ZIP contains one top-level directory, use it as the project root.
          dirs=()
          while IFS= read -r -d '' d; do
            dirs+=("$d")
          done < <(find .import-tmp -mindepth 1 -maxdepth 1 -type d -print0)

          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find .import-tmp -mindepth 1 -maxdepth 1 -type f -print0)

          if [ "${#dirs[@]}" -eq 1 ] && [ "${#files[@]}" -eq 0 ] && [ -f "${dirs[0]}/index.html" ]; then
            ROOT="${dirs[0]}"
          fi

          if [ ! -f "$ROOT/index.html" ]; then
            echo "::error::index.html was not found in extracted archive."
            find .import-tmp -maxdepth 4 -type f -name 'index.html' -print
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "PROJECT ROOT: $ROOT"

      - name: Replace project files
        shell: bash
        env:
          ROOT: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail

          # Protect Git metadata and this workflow.
          cp ".github/workflows/import-sushi-house.yml" /tmp/import-sushi-house.yml

          # Remove previous project files, but NEVER remove .git or .github.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.import-tmp' \
            -exec rm -rf {} +

          # Copy the extracted project into repository root.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$ROOT/" "./"

          # Restore protected workflow.
          mkdir -p ".github/workflows"
          cp /tmp/import-sushi-house.yml ".github/workflows/import-sushi-house.yml"

          # Remove archive and temporary extraction directory.
          rm -f "${{ steps.archive.outputs.archive }}"
          rm -rf .import-tmp

      - name: Validate imported project
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f styles.css
          test -f app.js
          test -f menu.json

          echo "=== PROJECT FILES ==="
          ls -lah

          echo "=== INDEX MARKERS ==="
          grep -n -E 'hero|sales|categoryHub|menuHub|Как заказать|Преимущества' index.html | head -n 80 || true

          echo "=== ORDER CHECK ==="
          python3 - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8", errors="ignore")

          markers = [
              ("hero", s.find('class="hero')),
              ("sales", s.find('id="sales"')),
              ("categoryHub", s.find('id="categoryHub"')),
              ("howItWorks", s.find('id="howItWorks"')),
              ("benefits", s.find('id="benefits"')),
              ("footer", s.find("<footer")),
          ]

          print(markers)

          positions = [p for _, p in markers if p >= 0]
          if positions != sorted(positions):
              print("WARNING: marker order is not strictly increasing.")
          else:
              print("OK: major HTML markers are in order.")
          PY

          if command -v node >/dev/null 2>&1; then
            node --check app.js
          fi

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "NO CHANGES TO COMMIT"
            echo "HEAD_SHA=$(git rev-parse HEAD)"
            exit 0
          fi

          git commit -m "chore: import SUSHI HOUSE project"

          echo "LOCAL_COMMIT=$(git rev-parse HEAD)"

          git push origin HEAD:main

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"

          echo "========================================"
          echo "SUSHI HOUSE IMPORT COMPLETE"
          echo "LOCAL SHA : $LOCAL_SHA"
          echo "REMOTE SHA: $REMOTE_SHA"
          echo "========================================"

          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::Local and remote SHA differ after push."
            exit 1
          fi

          echo "OK: origin/main exactly matches the imported commit."
