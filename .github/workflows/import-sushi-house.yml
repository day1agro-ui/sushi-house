name: Import SUSHI HOUSE archive

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sushi-house-import
  cancel-in-progress: false

jobs:
  import-project:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: import SUSHI HOUSE project') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnose repository state BEFORE import
        shell: bash
        run: |
          set -euo pipefail
          echo '===== BEFORE IMPORT ====='
          echo "Event SHA:       $GITHUB_SHA"
          echo "Event commit:    ${{ github.event.head_commit.message }}"
          echo "Branch:          $GITHUB_REF_NAME"
          echo "HEAD:            $(git rev-parse HEAD)"
          echo "HEAD short:      $(git rev-parse --short HEAD)"
          echo "Remote:          $(git remote get-url origin)"
          echo '--- root files ---'
          find . -maxdepth 1 -type f -printf '%f\n' | sort
          echo '========================='

      - name: Find newest SUSHI HOUSE archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find . -maxdepth 1 -type f -name 'sushi-house-*.zip' -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo 'No sushi-house-*.zip found. Nothing to import.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          archive="${archives[0]}"
          echo '===== ARCHIVE SELECTED ====='
          printf '%s\n' "${archives[@]}"
          echo "Selected: $archive"
          echo "Size: $(stat -c '%s bytes' "$archive")"
          echo "SHA256: $(sha256sum "$archive" | cut -d' ' -f1)"
          echo '============================='
          echo 'found=true' >> "$GITHUB_OUTPUT"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Extract and replace project
        if: steps.archive.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.archive.outputs.path }}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          unzip -q "$archive" -d "$tmp"
          rm -rf "$tmp/.git" "$tmp/.github"

          echo '===== ARCHIVE CONTENT ====='
          find "$tmp" -maxdepth 2 -type f -printf '%P\n' | sort
          echo '==========================='

          mapfile -t dirs < <(find "$tmp" -mindepth 1 -maxdepth 1 -type d -print)
          if [ "${#dirs[@]}" -eq 1 ] && [ ! -f "$tmp/index.html" ]; then
            src="${dirs[0]}"
          else
            src="$tmp"
          fi

          test -f "$src/index.html" || { echo 'ERROR: index.html not found in archive'; exit 1; }

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='sushi-house-*.zip' \
            "$src"/ ./

          rm -f "$archive"

      - name: Verify EXACT imported content
        if: steps.archive.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f menu.json
          test -f .github/workflows/import-sushi-house.yml

          echo '===== IMPORTED FILES ====='
          ls -lah index.html app.js styles.css menu.json
          echo '==========================='

          echo '===== HTML LAYOUT MARKERS ====='
          grep -nE 'data-layout-version|id="homeHero"|id="sales"|id="categoryHub"|id="howItWorks"|id="benefits"' index.html || true
          echo '================================'

          echo '===== HTML ORDER CHECK ====='
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          ids=['homeHero','sales','categoryHub','howItWorks','benefits']
          pos={i:s.find(f'id="{i}"') for i in ids}
          print(pos)
          if any(v < 0 for v in pos.values()):
              raise SystemExit('Missing required layout marker')
          if not (pos['homeHero'] < pos['sales'] < pos['categoryHub'] < pos['howItWorks'] < pos['benefits']):
              raise SystemExit('ERROR: HTML block order is NOT 2 -> 5 -> 6 -> 3 -> 4 -> 7 -> 8')
          print('OK: HTML order is Hero -> Sales -> Menu -> HowItWorks -> Benefits')
          PY

          echo '===== CSS ORDER RULES ====='
          grep -nE '#(homeHero|sales|categoryHub).*order|order:[[:space:]]*[0-9]+' styles.css | head -80 || true
          echo '============================'

          echo '===== JS CHECK ====='
          node --check app.js
          echo 'OK: app.js syntax'

      - name: Commit and push FINAL state
        if: steps.archive.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A
          git reset -- .github/workflows/ 2>/dev/null || true

          echo '===== STAGED STATE ====='
          git status --short
          git diff --cached --stat
          echo '========================'

          if git diff --cached --quiet; then
            echo 'NO_CHANGES=true' >> "$GITHUB_STEP_SUMMARY"
            echo 'No project changes to commit.'
            exit 0
          fi

          git commit -m 'chore: import SUSHI HOUSE project'
          git push origin HEAD:main

          git fetch origin main --prune
          final_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"

          echo '===== FINAL RESULT ====='
          echo "FINAL LOCAL SHA:  $final_sha"
          echo "REMOTE MAIN SHA:  $remote_sha"
          echo "ARCHIVE SHA256:    ${{ steps.archive.outputs.sha256 }}"
          echo '========================'

          test "$final_sha" = "$remote_sha"

          {
            echo '# SUSHI HOUSE import diagnostics'
            echo
            echo "- Event SHA: \\`$GITHUB_SHA\\`"
            echo "- Archive SHA256: \\`${{ steps.archive.outputs.sha256 }}\\`"
            echo "- Final commit SHA: \\`$final_sha\\`"
            echo "- Remote main SHA: \\`$remote_sha\\`"
            echo '- HTML order: Hero → Sales → Menu → HowItWorks → Benefits'
            echo '- app.js: node --check OK'
          } >> "$GITHUB_STEP_SUMMARY"
