name: Import SUSHI HOUSE archive

on:
  push:
    branches:
      - main
    paths:
      - "sushi-house-*.zip"
      - ".github/workflows/import-sushi-house.yml"
  workflow_dispatch:
    inputs:
      sync_photos:
        description: "After importing the site, download/process all real product photos from the old site"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sushi-house-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'sushi-house-*.zip' -printf '%f\n' | sort | tail -n 1)"
          if [ -z "$ARCHIVE" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.sync_photos }}" = "true" ]; then
              echo "archive=" >> "$GITHUB_OUTPUT"
              echo "No archive: photo-only run on current project."
              exit 0
            fi
            echo "::error::No sushi-house-*.zip found in repository root."
            exit 1
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE FOUND: $ARCHIVE"

      - name: Extract archive
        id: extract
        if: ${{ steps.archive.outputs.archive != '' }}
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          set -euo pipefail
          IMPORT_ROOT="$(mktemp -d /tmp/sushi-house-import-XXXXXX)"
          echo "IMPORT_ROOT=$IMPORT_ROOT" >> "$GITHUB_OUTPUT"
          unzip -q "$GITHUB_WORKSPACE/$ARCHIVE" -d "$IMPORT_ROOT"

      - name: Detect project root
        id: root
        if: ${{ steps.archive.outputs.archive != '' }}
        shell: bash
        env:
          IMPORT_ROOT: ${{ steps.extract.outputs.IMPORT_ROOT }}
        run: |
          set -euo pipefail
          ROOT="$IMPORT_ROOT"
          mapfile -t dirs < <(find "$IMPORT_ROOT" -mindepth 1 -maxdepth 1 -type d)
          mapfile -t files < <(find "$IMPORT_ROOT" -mindepth 1 -maxdepth 1 -type f)
          if [ "${#dirs[@]}" -eq 1 ] && [ "${#files[@]}" -eq 0 ] && [ -f "${dirs[0]}/index.html" ]; then ROOT="${dirs[0]}"; fi
          test -f "$ROOT/index.html"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Validate project
        if: ${{ steps.archive.outputs.archive != '' }}
        env:
          ROOT: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          for file in index.html styles.css app.js menu.json; do test -f "$ROOT/$file"; done
          node --check "$ROOT/app.js"

      - name: Replace repository project
        if: ${{ steps.archive.outputs.archive != '' }}
        env:
          ROOT: ${{ steps.root.outputs.root }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sushi-house-protected
          cp "$GITHUB_WORKSPACE/.github/workflows/import-sushi-house.yml" /tmp/sushi-house-protected/import-sushi-house.yml
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$ROOT/" "$GITHUB_WORKSPACE/"
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          cp /tmp/sushi-house-protected/import-sushi-house.yml "$GITHUB_WORKSPACE/.github/workflows/import-sushi-house.yml"
          rm -f "$GITHUB_WORKSPACE/$ARCHIVE"

      - name: Optional bulk photo sync
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_photos == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow "rembg[cpu]"
          python3 tools/photo_pipeline.py
          python3 - <<'PY'
          import json
          d=json.load(open('menu.json',encoding='utf-8'))
          with_images=sum(1 for p in d['products'] if p.get('image'))
          print(f'PHOTO RESULT: {with_images}/{len(d["products"])} products have images')
          PY

      - name: Final validation
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f menu.json
          test -f .github/workflows/import-sushi-house.yml
          node --check app.js

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "NO CHANGES TO COMMIT"
            exit 0
          fi
          git commit -m "chore: import SUSHI HOUSE project"
          git push origin HEAD:main
